openapi: 3.0.0
info:
  title: AI Todo Chatbot API
  version: 1.0.0
  description: API for the AI-powered todo chatbot system
servers:
  - url: https://api.todo-chatbot.com/v1
    description: Production server
  - url: https://staging.todo-chatbot.com/v1
    description: Staging server
paths:
  /api/{user_id}/chat:
    post:
      summary: Process user message in chat conversation
      description: Handles user messages and returns AI-generated responses with tool calls
      parameters:
        - name: user_id
          in: path
          required: true
          description: The ID of the authenticated user
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                conversation_id:
                  type: string
                  description: Optional ID of existing conversation to continue
                message:
                  type: string
                  description: The user's message content
              required:
                - message
      responses:
        '200':
          description: Successful response from AI agent
          content:
            application/json:
              schema:
                type: object
                properties:
                  conversation_id:
                    type: string
                    description: ID of the conversation (new or existing)
                  response:
                    type: string
                    description: AI agent's response to the user
                  tool_calls:
                    type: array
                    description: List of tools called during processing
                    items:
                      type: object
                      properties:
                        tool_name:
                          type: string
                          description: Name of the MCP tool that was called
                        arguments:
                          type: object
                          description: Arguments passed to the tool
                        result:
                          type: object
                          description: Result returned by the tool
        '400':
          description: Bad request - invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized - invalid or missing authentication
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden - user not authorized for this action
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not found - conversation or user doesn't exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limited - too many requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
        - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              description: Error code
            message:
              type: string
              description: Human-readable error message
            details:
              type: object
              description: Additional error details