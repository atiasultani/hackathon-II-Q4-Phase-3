## Security

### JWT Token Format
Access tokens follow the JWT standard with these claims:
- `sub`: User ID (subject)
- `exp`: Expiration time (Unix timestamp)
- `iat`: Issued at time (Unix timestamp)
- `jti`: JWT ID for potential revocation

### Authorization
- All MCP tools require authentication via JWT token in Authorization header
- MCP tools validate that the user_id in the request matches the authenticated user
- MCP tools ensure users can only operate on resources they own
- MCP tools return appropriate error codes for unauthorized access attempts

### Input Validation
- User ID and Task ID must be valid UUID format
- Title must be provided and not exceed 255 characters for add/update operations
- Description must not exceed 1000 characters
- Status parameter must be one of: all, active, completed (for list_tasks)

### Data Isolation
- All queries include user_id filter to prevent cross-user data access
- Foreign key relationships enforce ownership at the database level
- API endpoints validate user_id matches token user_id
- Error responses don't leak information about other users' data