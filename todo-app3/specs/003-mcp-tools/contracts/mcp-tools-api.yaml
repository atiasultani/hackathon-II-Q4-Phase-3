# API Contract: MCP Tools for Task Management

## Base URL
```
https://api.yourapp.com
```

## MCP Tools API

### POST /api/mcp/add_task

Add a new task to the authenticated user's task list.

#### Request
```json
{
  "user_id": "a1b2c3d4-e5f6-7890-1234-567890abcdef",
  "title": "Buy groceries",
  "description": "Milk, eggs, bread"
}
```

#### Headers
```
Authorization: Bearer {accessToken}
Content-Type: application/json
```

#### Response Codes
- 200: Task added successfully
- 400: Validation error (missing title, invalid user_id)
- 401: Unauthorized (invalid/expired token)
- 403: Forbidden (user tried to access another user's tasks)
- 500: Internal server error

#### Success Response (200)
```json
{
  "success": true,
  "task": {
    "id": "t1b2c3d4-e5f6-7890-1234-567890abcdef",
    "user_id": "a1b2c3d4-e5f6-7890-1234-567890abcdef",
    "title": "Buy groceries",
    "description": "Milk, eggs, bread",
    "completed": false,
    "created_at": "2023-02-01T10:30:00Z",
    "updated_at": "2023-02-01T10:30:00Z"
  },
  "message": "Task created successfully"
}
```

#### Error Response (400)
```json
{
  "error": "Validation failed",
  "details": {
    "title": "Title is required and cannot be empty"
  }
}
```

### POST /api/mcp/list_tasks

Retrieve all tasks for the authenticated user.

#### Request
```json
{
  "user_id": "a1b2c3d4-e5f6-7890-1234-567890abcdef",
  "status": "active"  // Optional: all, active, completed
}
```

#### Headers
```
Authorization: Bearer {accessToken}
Content-Type: application/json
```

#### Response Codes
- 200: Tasks retrieved successfully
- 400: Validation error (invalid user_id)
- 401: Unauthorized (invalid/expired token)
- 403: Forbidden (user tried to access another user's tasks)
- 500: Internal server error

#### Success Response (200)
```json
{
  "success": true,
  "tasks": [
    {
      "id": "t1b2c3d4-e5f6-7890-1234-567890abcdef",
      "user_id": "a1b2c3d4-e5f6-7890-1234-567890abcdef",
      "title": "Buy groceries",
      "description": "Milk, eggs, bread",
      "completed": false,
      "created_at": "2023-02-01T10:30:00Z",
      "updated_at": "2023-02-01T10:30:00Z"
    }
  ],
  "count": 1,
  "filters": {
    "status": "active"
  }
}
```

