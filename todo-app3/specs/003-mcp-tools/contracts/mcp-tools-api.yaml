```
Authorization: Bearer {accessToken}
Content-Type: application/json
```

#### Response Codes
- 200: Task completed successfully
- 400: Validation error (invalid user_id or task_id)
- 401: Unauthorized (invalid/expired token)
- 403: Forbidden (user tried to access another user's task)
- 404: Task not found
- 500: Internal server error

#### Success Response (200)
```json
{
  "success": true,
  "task": {
    "id": "t1b2c3d4-e5f6-7890-1234-567890abcdef",
    "user_id": "a1b2c3d4-e5f6-7890-1234-567890abcdef",
    "title": "Buy groceries",
    "description": "Milk, eggs, bread",
    "completed": true,
    "created_at": "2023-02-01T10:30:00Z",
    "updated_at": "2023-02-01T15:45:00Z"
  },
  "message": "Task completed successfully"
}
```

